<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Presentation</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #canvas { width: 100%; height: 100%; display: block; }
    #overlays {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    #overlays > * { pointer-events: auto; }

    /* --- Nav dots --- */
    .nav-dots {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.6rem;
      z-index: 20;
    }
    .nav-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
      pointer-events: auto;
    }
    .nav-dot:hover {
      background: rgba(255, 255, 255, 0.5);
      transform: scale(1.2);
    }
    .nav-dot.active {
      background: rgba(255, 255, 255, 0.9);
      transform: scale(1.3);
    }

    /* --- Panels (frosted glass) --- */
    .panel {
      position: fixed;
      background: rgba(15, 15, 25, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 1.5rem;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
      font-size: 0.9rem;
      line-height: 1.5;
      opacity: 0;
      transition: opacity 0.4s ease;
      display: none;
    }
    .panel.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="overlays"></div>

  <!-- Chart panel -->
  <div id="chart-panel" class="panel" style="top: 10%; right: 2rem; width: 500px; height: 380px;">
    <div id="chart-container" style="width: 100%; height: 100%;"></div>
  </div>

  <!-- UMAP 2×3 grid panel -->
  <div id="umap-grid-panel" class="panel" style="top: 5%; left: 2%; width: 96%; height: 88%; padding: 0.8rem;">
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 0.5rem; width: 100%; height: 100%;">
      <div id="umap-sample-nmf"   style="min-height: 0;"></div>
      <div id="umap-sample-lda"   style="min-height: 0;"></div>
      <div id="umap-sample-dvae"  style="min-height: 0;"></div>
      <div id="umap-feature-nmf"  style="min-height: 0;"></div>
      <div id="umap-feature-lda"  style="min-height: 0;"></div>
      <div id="umap-feature-dvae" style="min-height: 0;"></div>
    </div>
  </div>
  <!-- Uncomment to enable threejs-devtools-mcp live inspection:
  <script src="http://localhost:8080/bridge.js"></script>
  -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
